name: boot-amqp-artemis

on:
  push:
    paths:
      - "boot-amqp-artemis/**"
      - ".github/workflows/boot-amqp-artemis.yml"
    branches:
      - master
  pull_request:
    paths:
      - "boot-amqp-artemis/**"
      - ".github/workflows/boot-amqp-artemis.yml"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 25
          cache: "maven"

      - name: Build with Maven
        run: mvn -B -q clean package --file boot-amqp-artemis/pom.xml