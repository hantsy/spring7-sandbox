name: boot-http-service-client-restclient

on:
  push:
    paths:
      - "boot-http-service-client-restclient/**"
    branches:
      - master
  pull_request:
    paths:
      - "boot-http-service-client-restclient/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"

      - name: Build with Maven
        run: mvn -B -q clean package --file boot-http-service-client-restclient/pom.xml
        

