name: boot-data-elasticsearch

on:
  push:
    paths:
      - "boot-data-elasticsearch/**"
      - ".github/workflows/boot-data-elasticsearch.yml"
    branches:
      - master
  pull_request:
    paths:
      - "boot-data-elasticsearch/**"
      - ".github/workflows/boot-data-elasticsearch.yml"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          cache: "maven"

      - name: Build with Maven
        run: mvn -B -q clean package --file boot-data-elasticsearch/pom.xml
        

