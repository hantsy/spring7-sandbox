name: resilience

on:
  push:
    paths:
      - "resilience/**"
    branches:
      - master
  pull_request:
    paths:
      - "resilience/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 25
          cache: "maven"

      - name: Build with Maven
        run: mvn -B -q clean package --file resilience/pom.xml
        

