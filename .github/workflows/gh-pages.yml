name: gh-pages 

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/gh-pages.yml"
    branches:
      - master 
      - main
permissions:
  contents: write
  pages: write
      
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: |
          pip install mkdocs-material 
          pip install mkdocs-git-revision-date-plugin
      - run: mkdocs gh-deploy --force