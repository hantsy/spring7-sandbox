site_name: "Spring 7 Cookbook"

repo_url: https://github.com/hantsy/spring7-sandbox
repo_name: hantsy/spring7-sandbox
theme:
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  name: material
  features:
    - content.code.copy
    - search.suggest
    - navigation.expand
    - navigation.indexes
    # - toc.integrate
  icon:
    repo: fontawesome/brands/git-alt

copyright: Copyright &copy;2024 Hantsy
extra:
  social:
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/hantsy
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/hantsy
    - icon: fontawesome/brands/medium
      link: https://medium.com/@hantsy
    - icon: fontawesome/brands/github
      link: https://github.com/hantsy

markdown_extensions:
  - meta
  - toc:
      toc_depth: 3
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences    
plugins:
  - search
  - git-revision-date

nav:
  - Preface: index.md
  - Core:
    - "Programmatic Bean Registration with BeanRegistrar": bean-reg.md
    - "Jackson 3": jackson.md
    - "Kotlin Serialization": kotlinx-serialization.md
    - "Modularization": modularization.md
    - "Resilience": resilience.md
  - Web: 
    - "API Versioning": api-versioning.md
  - Messaging:
    - "Spring RabbitMQ Client": rabbitmq-client.md
    - "JMS Client": jms-client.md
    - "Kafka Share Consumer": kafka-share-consumer.md
  - Data Access:
    - "Hibernate and Jakarta Data": jakarta-data.md
    - "Spring Data and AOT": spring-data-aot.md
  - Misc:
    - "Building Null Safety Spring Boot Applications": null-safety.md
    - "Migrating to Spring Boot 4: The Hard Way": migrating-sb4.md

